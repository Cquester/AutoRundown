# Build the Windows MSI, install it on a clean runner, check the installed
# app actually works (index a sample corpus, serve it, search it), then
# uninstall and check nothing is left. Free: no Anthropic API calls.
#
# Called by ci.yml alongside the tests (main, tags, and PRs that touch
# packaging); ci.yml makes the release from its AutoRundown-msi artifact
# once the tests, the browser checks and this have all passed.
# Run it on its own from the Actions tab with "Run workflow".
name: Windows installer

on:
  workflow_call:
  workflow_dispatch:

# read-only token: this workflow builds and tests, it never writes to the repo
permissions:
  contents: read

jobs:
  msi:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0     # the upgrade test builds an older version

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.13"

      - name: Install WiX
        run: |
          dotnet tool install --global wix --version 5.0.2
          wix extension add -g WixToolset.UI.wixext/5.0.2

      - name: Build MSI
        run: powershell -ExecutionPolicy Bypass -File packaging\windows\build.ps1

      - name: Installer dialogs
        shell: pwsh
        run: |
          # no one clicks through the wizard here (installs below are /qn), so
          # read the wiring from the MSI: Welcome -> Options -> Ready, the
          # sign-in box, and Launch on Finish
          $msi = (Get-ChildItem dist\*.msi).FullName
          $wi = New-Object -ComObject WindowsInstaller.Installer
          $db = $wi.GetType().InvokeMember("OpenDatabase", "InvokeMethod", $null, $wi, @($msi, 0))
          function Rows($sql) {
            $v = $db.GetType().InvokeMember("OpenView", "InvokeMethod", $null, $db, @($sql))
            [void]$v.GetType().InvokeMember("Execute", "InvokeMethod", $null, $v, $null)
            $out = @()
            while ($r = $v.GetType().InvokeMember("Fetch", "InvokeMethod", $null, $v, $null)) {
              $out += $r.GetType().InvokeMember("StringData", "GetProperty", $null, $r, @(1))
            }
            $out
          }
          function Need($what, $sql) {
            $r = @(Rows $sql); "$what`: $($r -join ', ')"
            if ($r.Count -lt 1) { throw "missing: $what" }
          }
          Need "Welcome -> Options" "SELECT Dialog_ FROM ``ControlEvent`` WHERE Dialog_='WelcomeDlg' AND Event='NewDialog' AND Argument='OptionsDlg'"
          Need "Options -> Ready" "SELECT Dialog_ FROM ``ControlEvent`` WHERE Dialog_='OptionsDlg' AND Event='NewDialog' AND Argument='VerifyReadyDlg'"
          Need "sign-in box" "SELECT Property FROM ``Control`` WHERE Dialog_='OptionsDlg' AND Property='AUTOSTART'"
          Need "Launch on Finish" "SELECT Dialog_ FROM ``ControlEvent`` WHERE Dialog_='ExitDialog' AND Event='DoAction' AND Argument='LaunchApp'"
          Need "Options page" "SELECT Dialog FROM ``Dialog`` WHERE Dialog='OptionsDlg'"
          if (@(Rows "SELECT Dialog FROM ``Dialog`` WHERE Dialog='WelcomeEulaDlg'").Count) { throw "licence page is in the MSI" }

      # 0.1.1 never changes, so its installer is built once and cached
      # (~3 min a run); bump the key's -v1 to rebuild it
      - name: Cache the 0.1.1 installer
        id: old-msi
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: old-msi
          key: msi-0.1.1-6a803f8-wix5.0.2-v1

      - name: Build the 0.1.1 installer (only when not cached)
        if: steps.old-msi.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          git worktree add ..\old 6a803f8
          Push-Location ..\old
          powershell -ExecutionPolicy Bypass -File packaging\windows\build.ps1 -Out dist-old
          Pop-Location
          New-Item -ItemType Directory -Force old-msi | Out-Null
          Copy-Item ..\old\dist-old\*.msi old-msi\

      - name: Upgrade over 0.1.1 (what a user already has)
        shell: pwsh
        run: |
          # install the 0.1.1 installer, then this build over it -- the path
          # a real user takes
          $old = (Get-ChildItem old-msi\*.msi).FullName
          # Windows Installer keeps a per-user product's Apps entry under
          # HKLM\...\Installer\UserData\<SID>, never HKCU\...\Uninstall
          $sid = [Security.Principal.WindowsIdentity]::GetCurrent().User.Value
          function Installed {
            @(Get-ItemProperty "HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Installer\UserData\$sid\Products\*\InstallProperties" -ErrorAction SilentlyContinue |
              Where-Object DisplayName -eq "AutoRundown" | ForEach-Object DisplayVersion)
          }
          $p = Start-Process msiexec -Wait -PassThru -ArgumentList "/i `"$old`" /qn /l*v old-install.log"
          if ($p.ExitCode) { throw "0.1.1 install failed: $($p.ExitCode)" }
          $v = @(Installed)   # @(): one result would come back as a bare string
          "before upgrade: $v"
          if ($v.Count -ne 1 -or $v[0] -ne "0.1.1") { throw "expected 0.1.1 in Apps, found '$v'" }
          $new = (Get-ChildItem dist\*.msi).FullName
          $p = Start-Process msiexec -Wait -PassThru -ArgumentList "/i `"$new`" /qn /l*v upgrade.log"
          if ($p.ExitCode) { Get-Content upgrade.log -Tail 80; throw "upgrade failed: $($p.ExitCode)" }
          $want = (python -c "import autorundown; print(autorundown.__version__)").Trim()
          $v = @(Installed)   # @(): one result would come back as a bare string
          "after upgrade: $v"
          if ($v.Count -ne 1 -or $v[0] -ne $want) { throw "expected only $want in Apps, found '$v'" }
          # 0.1.1 never asked about starting at sign-in, so the upgrade turns it
          # on -- the same SetProperty condition (no autostart_asked) as a
          # first install with no AUTOSTART given, so this also covers that
          $startup = "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\Startup\AutoRundown.lnk"
          if (-not (Test-Path $startup)) { throw "upgrade did not add the Startup shortcut" }
          $t = (New-Object -ComObject WScript.Shell).CreateShortcut($startup)
          if ($t.TargetPath -notlike "*\pythonw.exe" -or $t.Arguments -notmatch "--background") {
            throw "Startup shortcut does not start the background mode: $($t.TargetPath) $($t.Arguments)"
          }
          # and the upgraded app starts in the background
          $inst = "$env:LOCALAPPDATA\Programs\AutoRundown"
          Start-Process "$inst\python\pythonw.exe" -WorkingDirectory $inst `
            -ArgumentList "-m autorundown.launcher --background --no-browser"
          $ok = $false
          foreach ($i in 1..60) {
            try { Invoke-RestMethod http://127.0.0.1:8756/api/stats | Out-Null; $ok = $true; break }
            catch { Start-Sleep -Milliseconds 500 }
          }
          Get-Content "$env:USERPROFILE\.autorundown\autorundown.log" -ErrorAction SilentlyContinue
          if (-not $ok) { throw "upgraded app did not start" }
          & "$inst\python\python.exe" -m autorundown.launcher --stop
          Remove-Item -Recurse -Force "$env:USERPROFILE\.autorundown"   # next step is a first start

      - name: Install MSI again (same version, silent, per-user)
        shell: pwsh
        run: |
          $msi = (Get-ChildItem dist\*.msi).FullName
          $p = Start-Process msiexec -Wait -PassThru -ArgumentList "/i `"$msi`" /qn /l*v install.log"
          if ($p.ExitCode) { Get-Content install.log -Tail 40; throw "install failed: $($p.ExitCode)" }
          $inst = "$env:LOCALAPPDATA\Programs\AutoRundown"
          # (+ Scan VIN's vendored barcode/OCR libraries)
          foreach ($f in "python\python.exe", "app\ingest.py", "app\rebuild_wis.py", "app\remove_manuals.py", "app\charm_download.py", "app\unzip_lemon.py", "app\autorundown\web\index.html", "app\autorundown\web\icons\favicon.ico",
                         "app\autorundown\web\vendor\zxing-wasm-3.1.4\zxing_reader.wasm", "app\autorundown\web\vendor\tesseract-7.0.0\eng.traineddata.gz",
                         "app\autorundown\web\vendor\tesseract-7.0.0\tesseract-core-simd-lstm.wasm.js",
                         "app\extractor\vm_pipeline.py", "app\extractor\wis_paths.py", "app\extractor\pull_epc.js") {
            if (-not (Test-Path "$inst\$f")) { throw "missing after install: $f" }
          }
          $lnk = "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\AutoRundown.lnk"
          if (-not (Test-Path $lnk)) { throw "no Start menu shortcut" }
          $ic = (New-Object -ComObject WScript.Shell).CreateShortcut($lnk).IconLocation
          "Start menu shortcut icon: $ic"
          if ($ic -notmatch '\.ico') { throw "the Start menu shortcut has no icon: '$ic'" }

      - name: First start from the Start-menu shortcut, driven in Edge
        shell: pwsh
        run: |
          # a new user: no AUTORUNDOWN_HOME, no index, started from the shortcut
          python tools/make_sample_corpus.py
          python -m pip install --disable-pip-version-check -q -r requirements-dev.txt
          $py = "$env:LOCALAPPDATA\Programs\AutoRundown\python\python.exe"
          Start-Process "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\AutoRundown.lnk"
          $ok = $false
          foreach ($i in 1..60) {
            try { Invoke-RestMethod http://127.0.0.1:8756/api/stats | Out-Null; $ok = $true; break }
            catch { Start-Sleep -Milliseconds 500 }
          }
          if (-not $ok) { throw "the shortcut did not start the server" }
          # the shortcut starts it in the background: pythonw, no console
          $bg = @(Get-Process pythonw -ErrorAction SilentlyContinue)
          "background processes: $($bg.Count)"
          python packaging\windows\ui_check.py --channel msedge --corpus sample_corpus --shots ui-shots
          $rc = $LASTEXITCODE
          & $py -m autorundown.launcher --stop
          $stop = $LASTEXITCODE
          "--- background log:"; Get-Content "$env:USERPROFILE\.autorundown\autorundown.log"
          if ($rc) { throw "UI check failed" }
          if ($bg.Count -lt 1) { throw "the shortcut did not start pythonw" }
          if ($stop) { throw "launcher --stop failed" }

      # pictures for diagnosis only: a full artifact quota must not skip the
      # tests below (it did on PR #22)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        if: always()
        continue-on-error: true
        with:
          name: ui-screenshots
          path: ui-shots/
          retention-days: 7

      - name: Smoke test the installed app
        shell: pwsh
        run: |
          $inst = "$env:LOCALAPPDATA\Programs\AutoRundown"
          $py = "$inst\python\python.exe"
          $env:AUTORUNDOWN_HOME = "$env:RUNNER_TEMP\ar-home"
          # the sample corpus (made in the step above from the checkout) is
          # indexed and served by the installed Python
          & $py "$inst\app\ingest.py" --archive sample_corpus --index "$env:AUTORUNDOWN_HOME\index.db"
          if ($LASTEXITCODE) { throw "ingest failed" }
          # what the shortcut runs, from the install folder like the shortcut
          $srv = Start-Process $py -WorkingDirectory $inst -PassThru -NoNewWindow `
                   -ArgumentList "-m autorundown.launcher --no-browser --port 8756"
          $ok = $false
          foreach ($i in 1..60) {
            try { $stats = Invoke-RestMethod http://127.0.0.1:8756/api/stats; $ok = $true; break }
            catch { Start-Sleep -Milliseconds 500 }
          }
          if (-not $ok) { throw "server did not start" }
          $stats | Format-List
          if ($stats.vehicles -lt 1 -or $stats.pages -lt 1) { throw "empty index served" }
          $v = (Invoke-RestMethod http://127.0.0.1:8756/api/vehicles)[0]
          $hits = @(Invoke-RestMethod "http://127.0.0.1:8756/api/search?doc_id=$($v.doc_id)&q=torque")
          "search 'torque' on $($v.doc_id): $($hits.Count) result(s)"
          if ($hits.Count -lt 1) { throw "search found nothing" }
          $page = Invoke-WebRequest http://127.0.0.1:8756/ -UseBasicParsing
          if ($page.Content -notmatch "<html") { throw "UI not served" }
          $wasm = Invoke-WebRequest http://127.0.0.1:8756/vendor/zxing-wasm-3.1.4/zxing_reader.wasm -UseBasicParsing
          if ($wasm.Headers["Content-Type"] -ne "application/wasm") { throw "Scan VIN's barcode reader not served" }
          # the WIS extractor ships in the app and runs under the bundled
          # Python (no VirtualBox here, so it stops at --list-vms); it writes
          # to the app's data folder (%LOCALAPPDATA%\AutoRundown\Mercedes data),
          # never the Desktop nor the app's program folder
          $ext = "$env:LOCALAPPDATA\Programs\AutoRundown\app\extractor"
          $vms = Invoke-RestMethod http://127.0.0.1:8756/api/vms
          "extractor: $($vms.extractor) | $($vms.error)"
          if ($vms.extractor -ne $ext) { throw "the bundled extractor was not used" }
          $where = & "$env:LOCALAPPDATA\Programs\AutoRundown\python\python.exe" "$ext\wis_paths.py"
          "$where"
          # (under AUTORUNDOWN_HOME when that is set, as in this step)
          $data = if ($env:AUTORUNDOWN_HOME) { $env:AUTORUNDOWN_HOME } else { "$env:LOCALAPPDATA\AutoRundown" }
          if (-not ($where -match [regex]::Escape("out_root $data\Mercedes data\autorundown_out"))) {
            throw "the bundled extractor would not write to the app's data folder"
          }
          $me = Invoke-RestMethod http://127.0.0.1:8756/api/me
          if (-not $me.file_dialog) { throw "Browse would not open Windows' own file dialog" }
          # the phone name: announced, and resolvable from another process
          $s = Invoke-RestMethod http://127.0.0.1:8756/api/settings
          "phone: $($s.phone_urls -join ' | ')  autostart: $($s.autostart)"
          if (-not ($s.phone_urls -match 'autorundown\.local')) { throw "autorundown.local not announced" }
          python -m pip install --disable-pip-version-check -q zeroconf
          @'
          from zeroconf import AddressResolver, IPVersion, Zeroconf
          z = Zeroconf(ip_version=IPVersion.V4Only)
          r = AddressResolver("autorundown.local.")
          ok = r.request(z, 5000)
          print("autorundown.local ->", r.parsed_addresses() if ok else "NOT RESOLVED")
          z.close()
          raise SystemExit(0 if ok else 1)
          '@ | Set-Content resolve.py
          python resolve.py
          if ($LASTEXITCODE) { throw "autorundown.local did not resolve" }
          # start at sign-in: the Settings toggle writes the Startup shortcut
          Invoke-RestMethod -Method Post http://127.0.0.1:8756/api/settings `
            -ContentType application/json -Body '{"autostart": true}' | Out-Null
          $startup = "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\Startup\AutoRundown.lnk"
          if (-not (Test-Path $startup)) { throw "no Startup shortcut after turning it on" }
          $t = (New-Object -ComObject WScript.Shell).CreateShortcut($startup)
          "startup shortcut -> $($t.TargetPath) $($t.Arguments)"
          if ($t.TargetPath -notlike "*\pythonw.exe" -or $t.Arguments -notmatch "--background") {
            throw "Startup shortcut does not start the background mode"
          }
          if (-not (Invoke-RestMethod http://127.0.0.1:8756/api/settings).autostart) { throw "autostart not reported" }
          # left on: uninstall must remove it
          # a second start must find the running server and exit at once
          & $py -m autorundown.launcher --no-browser --port 8756
          if ($LASTEXITCODE) { throw "second launch failed" }
          # the process may have gone already (it passed on two runs, failed on
          # one with "Cannot find a process"); what matters is the server stops
          Stop-Process -Id $srv.Id -Force -ErrorAction SilentlyContinue
          try { Invoke-RestMethod -Method Post http://127.0.0.1:8756/api/shutdown | Out-Null } catch {}
          $srv.WaitForExit(15000) | Out-Null

      - name: Uninstall (while running in the background)
        shell: pwsh
        run: |
          # the installer must stop a running copy itself (StopRunning), or
          # files stay in use
          $inst = "$env:LOCALAPPDATA\Programs\AutoRundown"
          Start-Process "$inst\python\pythonw.exe" -WorkingDirectory $inst `
            -ArgumentList "-m autorundown.launcher --background --no-browser"
          $ok = $false
          foreach ($i in 1..60) {
            try { Invoke-RestMethod http://127.0.0.1:8756/api/stats | Out-Null; $ok = $true; break }
            catch { Start-Sleep -Milliseconds 500 }
          }
          if (-not $ok) { throw "background start failed" }
          $msi = (Get-ChildItem dist\*.msi).FullName
          $p = Start-Process msiexec -Wait -PassThru -ArgumentList "/x `"$msi`" /qn /l*v uninstall.log"
          if ($p.ExitCode) { Get-Content uninstall.log -Tail 40; throw "uninstall failed: $($p.ExitCode)" }
          $inst = "$env:LOCALAPPDATA\Programs\AutoRundown"
          if (Test-Path $inst) {
            $left = @(Get-ChildItem $inst -Recurse -Force)
            Write-Host "$($left.Count) item(s) left in $inst"
            $left | Select-Object -First 40 | ForEach-Object { Write-Host "  $($_.FullName)" }
            throw "files left behind after uninstall"
          }
          if (-not (Test-Path "$env:RUNNER_TEMP\ar-home\index.db")) { throw "uninstall touched user data" }
          if (Test-Path "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\Startup\AutoRundown.lnk") {
            throw "Startup shortcut left after uninstall"
          }
          try { Invoke-RestMethod http://127.0.0.1:8756/api/stats | Out-Null; throw "still running after uninstall" }
          catch { if ($_.Exception.Message -eq "still running after uninstall") { throw } }

      - name: Start at sign-in is the user's choice
        shell: pwsh
        run: |
          # what the Options page sets when unticked: AUTOSTART=0, no Startup
          # shortcut. On by default is checked by the upgrade step above
          # (uninstall removes autostart_asked, so a first install takes the
          # same branch), which saves an install + uninstall (~1.5 min).
          $msi = (Get-ChildItem dist\*.msi).FullName
          $startup = "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\Startup\AutoRundown.lnk"
          $p = Start-Process msiexec -Wait -PassThru -ArgumentList "/i `"$msi`" AUTOSTART=0 /qn /l*v autostart.log"
          if ($p.ExitCode) { Get-Content autostart.log -Tail 40; throw "install 'AUTOSTART=0' failed: $($p.ExitCode)" }
          $has = Test-Path $startup
          "install 'AUTOSTART=0': Startup shortcut $has"
          if ($has) { throw "install 'AUTOSTART=0': a Startup shortcut was made" }
          $p = Start-Process msiexec -Wait -PassThru -ArgumentList "/x `"$msi`" /qn"
          if ($p.ExitCode) { throw "uninstall failed: $($p.ExitCode)" }

      # the release needs this one on main; on a PR it is a convenience
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        continue-on-error: ${{ github.event_name == 'pull_request' }}
        with:
          name: AutoRundown-msi
          path: dist/*.msi
          retention-days: 3

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        if: failure()
        continue-on-error: true
        with:
          name: msi-logs
          path: "*.log"
          retention-days: 7
