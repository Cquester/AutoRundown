# Every pull request and every push to main: lint, the free test suites and
# a sample index served and searched (job "test"), and alongside it a first
# start and the UI checks driven in a real browser (job "browser").
#
# No installer is built here (the user's decision, 2026-10-23): after a PR
# is merged to main, the session that made it builds and installs the MSI on
# the PC (packaging/windows/build.ps1). windows-msi.yml can still be run by
# hand from the Actions tab.
#
# Free of Anthropic charges by construction: no secret is used anywhere, the
# API key is forced empty and the API address points at a closed port, and
# the browser tests abort /api/ask.
#
# Runners: Linux always. Windows and macOS test legs join automatically once
# the repository is public (Actions minutes are free then; while private,
# Windows minutes count double and macOS ten times).
name: CI

on:
  pull_request:
    paths-ignore: ["**.md", "docs/**", ".claude/**", "LICENSE"]
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore: ["**.md", "docs/**", ".claude/**", "LICENSE"]
  workflow_dispatch:

permissions:
  contents: read

# a new push to a PR replaces its running checks; main and tags always finish
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  ANTHROPIC_API_KEY: ""
  ANTHROPIC_BASE_URL: "http://127.0.0.1:9"   # any stray API call fails at once
  PYTHONUTF8: "1"
  PYTHONIOENCODING: utf-8

jobs:
  test:
    name: Tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(github.event.repository.private && '["ubuntu-latest"]' || '["ubuntu-latest","windows-latest","macos-latest"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.pw-browsers
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.13"     # what the MSI bundles
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install
        run: python -m pip install --disable-pip-version-check -r requirements.txt -r requirements-dev.txt ruff

      - name: Lint (pyflakes rules)
        run: ruff check --select F --output-format github .

      - name: UI JavaScript parses
        run: python tools/check_js.py

      - name: Test suites
        run: |
          rc=0
          for t in tests/test_citations.py tests/test_records.py tests/test_access.py \
                   tests/test_lemon_import.py tests/test_lemon_catalogue.py \
                   tests/test_remove_manuals.py tests/test_wis_links.py tests/test_fake_api.py \
                   tests/test_epc_join.py tests/test_vm_jobs.py \
                   tests/test_handoff.py tests/test_history.py tests/test_chat.py tests/test_providers.py tests/test_vin.py \
                   tests/test_rebuild_wis.py tests/test_wis_tables.py tests/test_parts_diagrams.py \
                   tests/test_synonyms.py tests/test_job_numbers.py; do
            echo "::group::$t"
            start=$SECONDS
            python "$t" || { echo "::error::$t failed"; rc=1; }
            echo "$t: $((SECONDS - start)) s"
            echo "::endgroup::"
          done
          exit $rc

      - name: Sample index, served and searched
        run: |
          python tools/make_sample_corpus.py
          export AUTORUNDOWN_HOME="$RUNNER_TEMP/smoke-home"
          python ingest.py --archive sample_corpus --index "$RUNNER_TEMP/smoke.db"
          python serve.py --index "$RUNNER_TEMP/smoke.db" --host 127.0.0.1 --port 8760 > "$RUNNER_TEMP/smoke.log" 2>&1 &
          for i in $(seq 60); do curl -sf http://127.0.0.1:8760/api/stats > /dev/null && break; sleep 0.5; done
          curl -sf http://127.0.0.1:8760/api/stats; echo
          doc=$(curl -sf http://127.0.0.1:8760/api/vehicles | python -c "import json,sys; print(max(json.load(sys.stdin), key=lambda v: v['indexed_pages'] or 0)['doc_id'])")
          n=$(curl -sf "http://127.0.0.1:8760/api/search?doc_id=$doc&q=torque" | python -c "import json,sys; print(len(json.load(sys.stdin)))")
          echo "search 'torque' on $doc: $n result(s)"
          # (not `curl | grep -q`: grep stops reading, curl gets SIGPIPE, pipefail fails)
          page=$(curl -sf http://127.0.0.1:8760/)
          [[ "$page" == *"<html"* ]] || { echo "::error::UI not served"; exit 1; }
          # a page naming some other host must be refused (DNS rebinding)
          code=$(curl -s -o /dev/null -w "%{http_code}" -H "Host: evil.example" http://127.0.0.1:8760/api/stats)
          [ "$code" = 421 ] || { echo "::error::foreign Host answered $code, expected 421"; exit 1; }
          curl -s -X POST http://127.0.0.1:8760/api/shutdown > /dev/null || true
          [ "$n" -ge 1 ] || { cat "$RUNNER_TEMP/smoke.log"; echo "::error::search found nothing"; exit 1; }

  # The checks driven in a real browser (Playwright: Chromium, or the
  # runner's Edge/Chrome), in parallel with `test`. A new browser test goes
  # here, not in the "Test suites" loop above.
  browser:
    name: Browser checks (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(github.event.repository.private && '["ubuntu-latest"]' || '["ubuntu-latest","windows-latest","macos-latest"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.pw-browsers
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.13"     # what the MSI bundles
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install
        run: python -m pip install --disable-pip-version-check -r requirements.txt -r requirements-dev.txt

      - name: Sample index
        run: |
          python tools/make_sample_corpus.py
          AUTORUNDOWN_HOME="$RUNNER_TEMP/smoke-home" python ingest.py --archive sample_corpus --index "$RUNNER_TEMP/smoke.db"

      - name: Cache Playwright's Chromium
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809  # v4.2.4
        with:
          path: ${{ github.workspace }}/.pw-browsers
          key: pw-${{ runner.os }}-${{ hashFiles('requirements-dev.txt') }}

      - name: Install Chromium
        run: python -m playwright install --with-deps chromium

      - name: First start, driven in Chromium (import, car box, search, phone width)
        run: |
          export AUTORUNDOWN_HOME="$RUNNER_TEMP/ui-home"     # no index: a new user
          python serve.py --host 127.0.0.1 --port 8756 > "$RUNNER_TEMP/ui-server.log" 2>&1 &
          for i in $(seq 60); do curl -sf http://127.0.0.1:8756/api/stats > /dev/null && break; sleep 0.5; done
          rc=0
          python packaging/windows/ui_check.py --url http://localhost:8756 --corpus sample_corpus --shots ui-shots || rc=$?
          curl -s -X POST http://127.0.0.1:8756/api/shutdown > /dev/null || true
          [ $rc = 0 ] || { echo "--- server log"; cat "$RUNNER_TEMP/ui-server.log"; }
          exit $rc

      - name: Scan VIN reads generated barcodes and VIN labels (vendored zxing + Tesseract)
        run: python tests/test_vin_scan.py

      - name: Car picker sends the car it shows (every suggestion, variant and VIN)
        # the sample corpus's hand-made variants; index opened read-only
        run: python tests/test_ui_picks.py --index "$RUNNER_TEMP/smoke.db"

      - name: Car history remembers the cars picked
        run: python tests/test_car_history.py --index "$RUNNER_TEMP/smoke.db"

      - name: Result tabs show each tab's results
        run: python tests/test_answer_tabs.py --index "$RUNNER_TEMP/smoke.db"

      - name: Manual contents, parts drawings (red picks, several at once) and the divider
        # builds its own sample index with the stand-in parts catalogue
        run: python tests/test_drawing_ui.py

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        if: failure()
        with:
          name: ui-shots-${{ matrix.os }}
          path: ui-shots/
